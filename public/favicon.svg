<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5df88"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa821f"/>
      <stop offset="100%" stop-color="#dfb743"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#aa821f" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="128" height="128" rx="28" fill="#0c0e12"/>
  <circle cx="64" cy="64" r="52" fill="url(#bgGrad)" stroke="url(#goldStroke)" stroke-width="2"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#goldStroke)" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Corner framing marks -->
  <path d="M 22 34 L 22 22 L 34 22" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
  <path d="M 106 34 L 106 22 L 94 22" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
  <path d="M 22 94 L 22 106 L 34 106" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
  <path d="M 106 94 L 106 106 L 94 106" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>

  <!-- Main 'E' Monogram -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Vertical stem -->
    <rect x="42" y="38" width="10" height="42" rx="1.5"/>
    <!-- Top arm -->
    <rect x="42" y="38" width="34" height="9" rx="1"/>
    <!-- Middle arm -->
    <rect x="42" y="55" width="26" height="8" rx="1"/>
    <!-- Bottom arm -->
    <rect x="42" y="71" width="34" height="9" rx="1"/>
  </g>

  <!-- Star Sparkle at Top Right of E -->
  <g transform="translate(85, 38)" fill="url(#goldGrad)">
    <!-- 8-Pointed Star -->
    <path d="M 0 -11 L 2.5 -2.5 L 11 0 L 2.5 2.5 L 0 11 L -2.5 2.5 L -11 0 L -2.5 -2.5 Z" />
    <circle cx="0" cy="0" r="1.5" fill="#fff" />
  </g>

  <!-- GLOBAL COLLEGE text -->
  <text x="64" y="99" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="11" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3.5">GLOBAL COLLEGE</text>
  <text x="64" y="109" font-family="'Inter', system-ui, sans-serif" font-size="5" font-weight="600" fill="#c5a059" text-anchor="middle" letter-spacing="2.5" opacity="0.85">INSTITUTE</text>
</svg>