<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Institutional Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Primary Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Electric Cyan-to-Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Soft Ambient Light Filter -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Modern Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>
  <circle cx="256" cy="256" r="190" fill="url(#centerGlow)"/>

  <!-- Logo Mark: The Global Academic "G" -->
  <g filter="url(#softShadow)">
    <!-- Outer Globe Meridian Arc (Blue Ring) -->
    <path
      d="M 256 96
         C 167.6 96 96 167.6 96 256
         C 96 344.4 167.6 416 256 416
         C 334.2 416 399.2 359.8 412.8 286
         L 358 286
         C 346.2 328.6 304.8 360 256 360
         C 198.6 360 152 313.4 152 256
         C 152 198.6 198.6 152 256 152
         C 289.4 152 318.8 167.8 337.4 192.4
         L 384 154
         C 352.8 118.2 307.2 96 256 96 Z"
      fill="url(#blueGrad)"
    />

    <!-- Interlocking Gold Ingot / Inward Terminal of "G" -->
    <path
      d="M 256 230
         L 396 230
         C 404.8 230 412 237.2 412 246
         L 412 280
         C 412 288.8 404.8 296 396 296
         L 256 296
         C 247.2 296 240 288.8 240 280
         L 240 246
         C 240 237.2 247.2 230 256 230 Z"
      fill="url(#goldGrad)"
    />

    <!-- Graduation Cap / Diamond Beacon at Upper Right of "G" -->
    <g transform="translate(372, 148)">
      <!-- Academic Mortarboard Diamond -->
      <polygon points="0,-42 42,0 0,42 -42,0" fill="url(#goldGrad)" />
      <!-- Inner Diamond Facet for 3D Cut -->
      <polygon points="0,-30 30,0 0,30 -30,0" fill="#fef08a" opacity="0.6"/>
      <!-- Tassel Drop -->
      <path d="M 0 0 L 26 28 L 26 44" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="26" cy="48" r="4.5" fill="#f59e0b"/>
    </g>

    <!-- Global Latitudinal Ring (Subtle orbital equator) -->
    <ellipse
      cx="256"
      cy="256"
      rx="124"
      ry="38"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="5"
      stroke-dasharray="8 8"
      opacity="0.45"
      transform="rotate(-15, 256, 256)"
    />

    <!-- Central Beacon Star of Knowledge -->
    <circle cx="256" cy="256" r="10" fill="#ffffff"/>
    <circle cx="256" cy="256" r="16" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  </g>
</svg>