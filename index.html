    <title>Global College — School Management System &amp; Portals</title>

      name="description"
      content="Global College Unified School Management System (SIMS, LMS, Bursar, Examinations &amp; Multi-Role Academic Portals)."
    />

    <!-- Prevent flash of wrong theme & register PWA Service Worker for Phone & Desktop installation -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('eclat-theme') || localStorage.getItem('bc-theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }

        window.__deferredPWAInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPWAInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-install-available', { detail: e }));
        });

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
          });
        }
      })();
    </script>
  </head>
  <body style="margin: 0; background: #f8fafc; color: #0f172a;">
